name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A dependency with a known advisory is a defect like any other, and this
      # is the cheapest gate in the file. `--omit=dev` because what ships is
      # what matters first; a dev-only advisory should not stop a deploy at
      # three in the morning, and Dependabot opens a PR for those anyway.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests, for logic that is plain functions: the address gazetteer
      # and the Zod schemas. Anything that depends on RLS is tested in the
      # database instead, by the `database` job below.
      - name: Unit tests
        run: npm run test:coverage

      # Runs without Supabase env vars on purpose: the app must build
      # without secrets. See lib/supabase/env.ts.
      - name: Build
        run: npm run build

  # Separate job: it needs Docker and takes minutes, while `verify` takes
  # seconds. Keeping them apart means a lint error fails fast.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Applies every migration to an empty database and then supabase/seed.sql,
      # so a migration that only works against one developer's existing data
      # fails here.
      - name: Start Supabase
        run: npx supabase start

      # The real gate. RLS is the only thing standing between one customer's
      # data and another's, so it is tested rather than assumed.
      - name: RLS policy tests
        run: npm run db:test

      # The spatial indexes and the pro feed, against a generated load, held to
      # wall-clock budgets. Placed here because this job already has the stack
      # up and the script needs nothing else. Without it the budgets in
      # scripts/postgis-load-check.mjs only bind when somebody remembers to run
      # it by hand — and the thing they are watching for, a feed that has
      # quietly gone back to a sequential scan, is invisible until it is slow
      # enough for a person to notice.
      - name: PostGIS load budgets
        run: npm run perf:postgis

      # A schema change with stale generated types is a broken build waiting to
      # happen in the next phase.
      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- lib/supabase/database.types.ts \
            || { echo "::error::lib/supabase/database.types.ts is stale — run 'npm run db:types' and commit the result"; exit 1; }

  # The critical flow, end to end, in a browser: posting a call, bidding,
  # choosing an offer, a field price update, completion and the receipt — plus
  # axe and the RTL sweep over every screen at both viewports. Its own job
  # because it needs Docker, browsers and a production build; roughly a minute
  # of tests behind a few minutes of setup.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Supabase
        run: npx supabase start

      # The local stack mints these on start. Exporting them here is what the
      # developer's .env.local does locally; playwright.config.ts builds the
      # app itself, and NEXT_PUBLIC_* is inlined at build time, so they have to
      # be in the environment before the suite runs.
      - name: Export the stack's credentials
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # No NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: the address field falls back to
      # manual entry without one (lib/maps/config.ts), which is the path CI
      # exercises. The server half of that fallback is refused in production
      # unless asked for by name, so playwright.config.ts sets
      # ALLOW_NO_MAPS_KEY on the web server it builds — the suite carries its
      # own answer rather than depending on this job's environment. Add the
      # secret here when the key exists to cover the other path.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
